name: CI

on:
  push:
    branches: [ master, 'v.*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msvc:
    name: MSVC (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DVIC_BUILD_DEMOS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  gcc-clang:
    name: ${{ matrix.compiler }} C++11 (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc"     >> $GITHUB_ENV
            echo "CXX=g++"    >> $GITHUB_ENV
          else
            echo "CC=clang"   >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build -j -- -k 2>&1 | tee build.log
      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E ': (error|warning): ' build.log | sed -E "s|^$GITHUB_WORKSPACE/||" | sort -u > diag.log || true
          { echo '### Compiler diagnostics'; echo '```'; cat diag.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          head -10 diag.log | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::error file=\1,line=\2,col=\3::\5/'
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan (clang, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DVIC_TEST_ASAN=ON
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build -j -- -k 2>&1 | tee build.log
      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E ': (error|warning): ' build.log | sed -E "s|^$GITHUB_WORKSPACE/||" | sort -u > diag.log || true
          { echo '### Compiler diagnostics'; echo '```'; cat diag.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          head -10 diag.log | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::error file=\1,line=\2,col=\3::\5/'
      - name: Test
        run: ctest --test-dir build --output-on-failure
